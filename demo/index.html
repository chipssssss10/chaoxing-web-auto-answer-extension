<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>答题助手 · 本地流程演示</title>
<style>body{font:16px/1.8 system-ui,"Microsoft YaHei",sans-serif;max-width:780px;margin:50px auto;padding:0 24px;background:#f2f7f5;color:#163f3b}h1{font-size:28px}small{color:#67877e}.question-item{background:#fff;padding:24px;border:1px solid #d7e5df;border-radius:16px;margin:24px 0}.question-title{font-weight:700;margin-bottom:18px}label{display:block;background:#f6f9f7;border-radius:9px;padding:10px 14px;margin:8px 0;cursor:pointer}input{accent-color:#126b5d;margin-right:12px}button,a{font:inherit;border:1px solid #bcd5cd;border-radius:8px;padding:8px 18px;cursor:pointer;background:#fff;color:#1b5548;text-decoration:none}button.primary{background:#166a59;color:#fff}nav{display:flex;gap:10px;flex-wrap:wrap}[role=dialog]{position:fixed;inset:30% auto auto 50%;transform:translateX(-50%);padding:28px;background:#fff;border:2px solid #69a68d;border-radius:16px;box-shadow:0 15px 90px #0003;z-index:9}#result{background:#dff2e6;border-radius:16px;padding:20px}code{background:#e2ece6;padding:3px 5px}#result:empty{display:none}</style></head>
<body>
<small>LOCAL DEMO · 仅用于验证流程</small><h1>答题助手模拟页</h1>
<p>先在扩展设置中填写本地演示 API，模型 <code>demo</code>、密钥 <code>demo-key</code>。再用扩展扫描此页，无需真实账号或付费接口。</p>
<nav><a href="?mode=spa">逐题切换</a><a href="?mode=all">整页多题</a><a href="?mode=reload">整页刷新翻题</a><a href="?mode=unsupported">不支持题型</a><a href="?mode=review">错题批改示例</a><a href="?mode=review-correct">全部正确示例</a></nav>
<p id="position"></p><main id="paper"></main><div id="buttons"></div><div id="result" role="status"></div>
<div id="confirm" role="dialog" aria-label="确认提交" hidden><p>确认提交试卷？提交后不能修改。</p><button id="cancel">取消</button> <button id="confirmSubmit" class="primary">确认提交</button></div>
<script>
const params = new URLSearchParams(location.search), mode = params.get('mode') || 'spa';
const questions = [
{ id:'q1', type:'single', title:'1.（单选题）1 + 1 等于几？', options:['2','3','4'], answers:['A'] },
{ id:'q2', type:'multiple', title:'2.（多选题）下列哪些数是质数？', options:['2','4','5','6'], answers:['A','C'] },
{ id:'q3', type:'judge', title:'3.（判断题）地球是平的。', options:['正确','错误'], answers:['B'] }
];
let index = Math.min(2, Math.max(0, Number(params.get('index')) || 0));
const reviewMode = ['review','review-correct'].includes(mode);
let saved = mode === 'reload' || params.get('afterSubmit') === '1' ? JSON.parse(sessionStorage.getItem('demoAnswers') || '{}') : reviewMode ? {q1:['A'],q2:mode==='review-correct'?['A','C']:['A'],q3:mode==='review-correct'?['B']:['A']} : {};
if (mode === 'reload' && index === 0) saved = {};
if (mode === 'unsupported') questions.push({id:'q4',type:'essay',title:'4.（简答题）请描述你的学习方法。',options:[],answers:[]});
function renderQuestion(q) {
 const block = document.createElement('section'); block.className='question-item'; block.dataset.questionId=q.id; block.dataset.type=q.type;
 const title=document.createElement('div');title.className='question-title';title.textContent=q.title;block.append(title);
 if (!q.options.length) {block.append(document.createElement('textarea')); return block;}
 q.options.forEach((text, i)=>{ const label=document.createElement('label'), input=document.createElement('input'); const letter=String.fromCharCode(65+i);
   input.type=q.type==='multiple'?'checkbox':'radio';input.name=q.id;input.value=letter;input.checked=!!saved[q.id]?.includes(letter);
   // Preselect two wrong choices on the multiple-choice item to test clearing them.
   if (q.id==='q2' && !saved[q.id] && ['B','D'].includes(letter)) input.checked=true;
   input.disabled=reviewMode;input.addEventListener('change',()=>save());label.append(input,document.createTextNode(letter+'. '+text));block.append(label);
 });
 if(reviewMode){
   const chosen=saved[q.id]||[];
   block.dataset.result=JSON.stringify(chosen.slice().sort())===JSON.stringify(q.answers)?'correct':q.type==='multiple'&&chosen.length&&chosen.every(a=>q.answers.includes(a))?'partial':'wrong';
   const feedback=document.createElement('div');feedback.className='grading-result';
   const verdict=document.createElement('p');verdict.textContent=block.dataset.result==='correct'?'回答正确':block.dataset.result==='partial'?'部分正确':'回答错误';
   const correct=document.createElement('p');correct.className='correct-answer';correct.textContent='正确答案：'+q.answers.join('、');
   const user=document.createElement('p');user.className='my-answer';user.textContent='我的答案：'+(chosen.join('、')||'未作答');
   feedback.append(verdict,correct,user);block.append(feedback);
 }return block;
}
function save(){document.querySelectorAll('.question-item').forEach(el=>saved[el.dataset.questionId]=[...el.querySelectorAll('input:checked')].map(i=>i.value));sessionStorage.setItem('demoAnswers',JSON.stringify(saved));}
function render(){
 document.getElementById('paper').replaceChildren(...((mode==='all'||mode==='unsupported'||reviewMode)?questions:[questions[index]]).map(renderQuestion));
 if(reviewMode){document.getElementById('position').textContent='模拟批改结果';document.getElementById('buttons').replaceChildren();return;}
 document.getElementById('position').textContent=(mode==='all'||mode==='unsupported')?'全部题目':`第 ${index+1} / ${questions.length} 题`;
 const btn=document.createElement('button');btn.id=index<2&&mode!=='all'&&mode!=='unsupported'?'nextQuestion':'submitPaper';btn.className='primary';
 btn.textContent=btn.id==='nextQuestion'?'下一题':'提交试卷';btn.onclick=()=>{
  save();if(btn.id==='nextQuestion'){index++;if(mode==='reload'){location.href='?mode=reload&index='+index;}else{render();}}else document.getElementById('confirm').hidden=false;
 };document.getElementById('buttons').replaceChildren(btn);
}
document.getElementById('cancel').onclick=()=>document.getElementById('confirm').hidden=true;
document.getElementById('confirmSubmit').onclick=()=>{save();document.getElementById('confirm').hidden=true;if(params.get('submitReload')==='1'){location.href='?mode=review&afterSubmit=1';return;} const correct=questions.filter(q=>JSON.stringify((saved[q.id]||[]).slice().sort())===JSON.stringify(q.answers)).length;
 document.getElementById('paper').replaceChildren();document.getElementById('buttons').replaceChildren();document.getElementById('result').textContent=`提交成功：${correct} / ${questions.length} 题答案符合本地预设。`;window.demoSubmitted=true;};
render();
</script></body></html>
